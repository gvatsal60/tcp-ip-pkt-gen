name: Build Project
permissions:
  contents: read
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["*"]
jobs:
  build-docker-images:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build all Dockerfiles
        env:
          IMAGE_NAME: ${{ github.repository_owner }}/github-test
        run: |
          for file in $(find dockerfiles -type f -name 'Dockerfile*'); do
              filename=$(basename "$file")
              if [ "$filename" = "Dockerfile" ]; then
                tag="default"
              else
                tag="${filename#Dockerfile.}"
              fi
              docker build -f "$file" -t "$IMAGE_NAME:$tag" "$(dirname "$file")"
          done
  build:
    runs-on: ubuntu-latest
    needs: build-docker-images
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: make build
      - name: Test
        run: make test
